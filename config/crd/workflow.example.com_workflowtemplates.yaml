apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowtemplates.workflow.example.com
spec:
  group: workflow.example.com
  names:
    kind: WorkflowTemplate
    listKind: WorkflowTemplateList
    plural: workflowtemplates
    singular: workflowtemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WorkflowTemplate is the Schema for the workflowtemplates API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: WorkflowTemplateSpec defines the desired state of WorkflowTemplate
            properties:
              steps:
                description: Steps defines the workflow as an ordered list of steps.
                  Steps run one at a time, in list order.
                items:
                  description: Step is a single unit of work, run as one Kubernetes
                    Job
                  properties:
                    args:
                      description: Args are passed to the command
                      items:
                        type: string
                      type: array
                    command:
                      description: Command overrides the image entrypoint
                      items:
                        type: string
                      type: array
                    image:
                      description: Image is the container image the step runs
                      type: string
                    name:
                      description: Name of the step
                      type: string
                    timeoutSeconds:
                      description: TimeoutSeconds bounds how long the step may run
                      format: int32
                      type: integer
                  required:
                  - image
                  - name
                  type: object
                minItems: 1
                type: array
            required:
            - steps
            type: object
          status:
            description: WorkflowTemplateStatus defines the observed state of WorkflowTemplate
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
