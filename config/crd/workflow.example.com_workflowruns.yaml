apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowruns.workflow.example.com
spec:
  group: workflow.example.com
  names:
    kind: WorkflowRun
    listKind: WorkflowRunList
    plural: workflowruns
    singular: workflowrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentStep
      name: Step
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WorkflowRun is the Schema for the workflowruns API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: WorkflowRunSpec defines the desired state of WorkflowRun
            properties:
              workflowTemplateRef:
                description: WorkflowTemplateRef references the WorkflowTemplate
                  to execute
                type: string
            required:
            - workflowTemplateRef
            type: object
          status:
            description: WorkflowRunStatus defines the observed state of WorkflowRun
            properties:
              currentStep:
                description: CurrentStep is the index of the step being executed
                format: int32
                type: integer
              message:
                description: Message is a human-readable description of the current
                  state
                type: string
              phase:
                description: Phase is the overall state of the run
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
